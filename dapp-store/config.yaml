# Solana Mobile dApp Store Publishing Configuration — Pactopus (Kyrvyn Ltd)
# Reference: https://docs.solanamobile.com/dapp-publishing/overview
# CLI Usage: npx @solana-mobile/dapp-store-cli validate -c dapp-store/config.yaml

publisher:
  name: Kyrvyn Ltd
  address: REPLACE_WITH_KYRVYN_PUBLISHER_SOLANA_WALLET_ADDRESS
  website: https://pactopus.kyrvynltd.co.uk
  email: contact@kyrvynltd.co.uk
  support_email: info@kyrvynltd.co.uk

app:
  name: Pactopus
  android_package: uk.co.kyrvynltd.pactopus
  urls:
    license_url: https://pactopus.kyrvynltd.co.uk/terms
    copyright_url: https://pactopus.kyrvynltd.co.uk/terms
    privacy_policy_url: https://pactopus.kyrvynltd.co.uk/privacy
    website: https://pactopus.kyrvynltd.co.uk
  media:
    - purpose: icon
      uri: ../public/logo.png

release:
  address: ''
  media:
    - purpose: icon
      uri: ../public/logo.png
  files:
    - purpose: install
      uri: ./app-release-signed.apk
  catalog:
    en-GB:
      name: Pactopus — Solana Seeker Invoicing
      short_description: Non-custodial SPL USDC/EURC invoicing with 0.25% (£5 cap) Solana Seeker hardware fee tier.
      long_description: |
        Pactopus by Kyrvyn Ltd is a non-custodial commercial invoicing and atomic SPL settlement dApp built for the Solana Seeker phone and UK/EU creators.
        
        Key Features:
        - Hardware-adaptive fee schedule: 0.25% fee capped at £5 GBP for Solana Seeker users (via Mobile Wallet Adapter 2.0 / Seed Vault & Seeker Genesis Token verification) vs 0.50% capped at £50 GBP on standard web.
        - Single-transaction atomic SPL split: Net payout to recipient ATA (with CreateIdempotent ATA initialization), capped platform fee to Kyrvyn Treasury, immutable SPL Memo v2 invoice reference, and Solana Pay Reference Key tracking.
        - UK HMRC-ready GBP accounting ledger, printable commercial PDF receipts, and CSV tax exports.
      new_in_version: Initial Solana Seeker dApp Store release with MWA 2.0 Wallet Standard discovery, Solana Pay QR/Blink Action endpoints, and UK GBP accounting.
      saga_features: Optimized for Solana Seeker AMOLED displays, Seed Vault MWA 2.0 one-tap signing, and Seeker Genesis Token (SGT) 50% fee reduction (0.25% max £5 cap).
  android_details:
    cert_fingerprint: 00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00
    min_sdk: 26
    version: 1.0.0
    version_code: 1
    locales:
      - en-GB
